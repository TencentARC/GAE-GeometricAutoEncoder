name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lightweight test dependencies
        # The full stack pins torch==2.5.1 + CUDA and is too heavy for CI.
        # These CPU-only wheels are enough for config, import, and data tests.
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff omegaconf numpy opencv-python-headless

      - name: Lint
        run: ruff check . || true

      - name: Config + data tests (no GPU, no weights)
        run: |
          pytest -q tests/test_configs.py tests/test_prepare_data.py tests/test_imports.py tests/test_pipeline_smoke.py
